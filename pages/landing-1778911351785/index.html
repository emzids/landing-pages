
<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>Kopi Ala Kazim</title>

<script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-white text-gray-800">

<section class="py-20 text-center max-w-4xl mx-auto px-6">

<div class="bg-red-100 text-red-600 inline-block px-4 py-2 rounded-full font-bold">
⚠️ Kencing Manis? Jangan Tunggu Sampai Terlambat!
</div>

<h1 class="text-5xl font-extrabold mt-8">
Kawal Gula Dalam Darah Secara Semula Jadi
</h1>

<p class="mt-6 text-xl text-gray-600">
Minuman herba untuk bantu anda rasa lebih bertenaga
</p>

<div class="mt-8 text-5xl font-black text-red-600">
RM99
</div>

<form
id="orderForm"
class="mt-12 max-w-md mx-auto space-y-4">

<input
type="text"
name="name"
placeholder="Nama"
required
class="w-full border p-4 rounded-xl"
/>

<input
type="tel"
name="phone"
placeholder="No Telefon"
required
class="w-full border p-4 rounded-xl"
/>

<input
type="email"
name="email"
placeholder="Email"
class="w-full border p-4 rounded-xl"
/>

<button
type="submit"
class="w-full bg-red-600 hover:bg-red-700 text-white py-5 rounded-2xl text-xl font-bold">

Order Sekarang

</button>

</form>

</section>

<script>

document
.getElementById('orderForm')
.addEventListener('submit', async (e) => {

e.preventDefault();

const formData = new FormData(e.target);

const response = await fetch(
'https://yourapi.com/api/order',
{
method: 'POST',
body: formData
});

const result = await response.json();

window.location.href = result.payment_url;

});

</script>

</body>
</html>
